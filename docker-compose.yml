services:
  schema-server:
    build: ./schema-server
    ports:
      - "5001:5001"
    volumes:
      - ./data:/data:ro
    environment:
      - SCHEMA_DIR=/data/schemas

  values-server:
    build: ./values-server
    ports:
      - "5002:5002"
    volumes:
      - ./data:/data:ro
    environment:
      - VALUES_DIR=/data/values

  bot-server:
    build: ./bot-server
    ports:
      - "5003:5003"
    environment:
      - SCHEMA_URL=http://schema-server:5001
      - VALUES_URL=http://values-server:5002
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=phi3
    depends_on:
      - schema-server
      - values-server
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    restart: always
